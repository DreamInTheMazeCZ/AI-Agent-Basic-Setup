name: learn-architecture
description: 프로젝트 아키텍처 학습 및 분석
group: learning

steps:
  - type: agent
    prompt: |
      이 FastAPI Starter Kit의 아키텍처를 상세히 분석하고 설명해주세요:

      ## 분석 범위:

      1. **전체 아키텍처 구조**
         - 프로젝트 폴더 구조 분석
         - 각 모듈의 역할과 책임
         - 모듈 간 의존성 맵

      2. **계층별 상세 분석**
         - **API Layer (Routes)**
           - 엔드포인트 정의 패턴
           - 요청 검증 방식
           - 응답 직렬화 방식

         - **Service Layer**
           - 비즈니스 로직 구현
           - 트랜잭션 관리
           - 에러 처리 패턴

         - **Repository Layer**
           - 데이터 접근 패턴
           - 쿼리 작성 방식
           - 데이터베이스 추상화

      3. **핵심 디자인 패턴**
         - 사용된 디자인 패턴 식별
         - 패턴이 적용된 이유
         - 각 패턴의 장단점

      4. **설정 및 초기화**
         - 환경 설정 관리
         - 데이터베이스 연결 초기화
         - 로깅 설정

      5. **학습 포인트**
         - 초보자가 배워야 할 핵심 개념
         - 베스트 프랙티스 예시
         - 실무 적용 가능한 패턴

      각 항목에 대해 코드 예시와 함께 설명해주세요.

    agent_options:
      effort: medium
      phase: Architecture Learning
