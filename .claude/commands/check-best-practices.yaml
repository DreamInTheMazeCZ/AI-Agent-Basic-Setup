name: check-best-practices
description: FastAPI 및 Python 베스트 프랙티스 검증
group: code-review

steps:
  - type: agent
    prompt: |
      이 FastAPI 프로젝트의 베스트 프랙티스 준수 상황을 점검해주세요:

      ## 검증 항목:

      1. **코드 품질 (Code Quality)**
         - PEP 8 준수 여부
         - 타입 힌팅 사용 정도
         - 변수/함수/클래스 네이밍 일관성
         - 코드 복잡도 (순환 복잡도)

      2. **에러 처리 및 로깅**
         - 예외 처리가 구체적인가?
         - 로깅 레벨 적절한가?
         - 에러 메시지가 명확한가?
         - 스택 트레이스 기록 여부

      3. **데이터베이스 상호작용**
         - ORM 사용 시 N+1 문제 여부
         - 연결 풀링 설정 확인
         - 쿼리 최적화 검토
         - 마이그레이션 관리 전략

      4. **보안 (Security)**
         - SQL Injection 방어
         - XSS 방어 (응답 처리)
         - CSRF 토큰 (필요시)
         - 인증/인가 검증
         - 환경 변수 보안 관리

      5. **성능 최적화**
         - 비동기 처리 활용
         - 캐싱 전략
         - 데이터베이스 인덱싱
         - 응답 직렬화 성능

      6. **테스트 가능성**
         - 단위 테스트 작성 용이성
         - Mock/Stub 가능성
         - 테스트 커버리지
         - 통합 테스트 구조

      7. **배포 및 운영**
         - 환경별 설정 관리
         - Docker 이미지 최적화
         - 헬스체크 엔드포인트
         - 로그 수집 전략
         - 모니터링 포인트

      8. **개발 생산성**
         - 개발 환경 설정 용이성
         - 핫 리로드 지원 여부
         - IDE 자동완성 지원
         - 문서화 상태

      ## 출력 형식:
      각 항목에 대해:
      ✅ 잘된 점 (현재 구현 예시)
      ⚠️  개선 필요 (구체적 개선 방안)
      📋 고려사항 (프로젝트 규모/단계별)

    agent_options:
      effort: high
      phase: Best Practices Check
